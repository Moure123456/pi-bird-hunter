<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة صيد الطيور</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #ui {
            margin-bottom: 10px;
            font-size: 22px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 25px;
            border-radius: 20px;
            border: 2px solid #4CAF50;
        }
        canvas {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 70%, #228B22 70%, #1e7b1e 100%);
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            touch-action: none;
            max-width: 95vw;
            max-height: 80vh;
        }
    </style>
</head>
<body>

    <div id="ui">النقاط: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="360" height="540"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");

        let score = 0;

        let bird = {
            x: -40,
            y: 150,
            radius: 22,
            speed: 2.5
        };

        function resetBird() {
            bird.x = -40;
            bird.y = Math.random() * (canvas.height * 0.5) + 50;
            bird.speed = 2 + Math.random() * 2;
        }

        function update() {
            bird.x += bird.speed;
            if (bird.x > canvas.width + 40) {
                resetBird();
            }
        }

        function draw() {
            // تنظيف الشاشة
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم جسم الطائر
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#FF4500";
            ctx.fill();
            ctx.strokeStyle = "#8B0000";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.closePath();

            // رسم الجناح
            ctx.beginPath();
            ctx.ellipse(bird.x - 5, bird.y + 2, 10, 6, Math.PI / 4, 0, Math.PI * 2);
            ctx.fillStyle = "#FFA500";
            ctx.fill();
            ctx.closePath();

            // رسم العين
            ctx.beginPath();
            ctx.arc(bird.x + 8, bird.y - 6, 4, 0, Math.PI * 2);
            ctx.fillStyle = "#FFFFFF";
            ctx.fill();
            ctx.closePath();

            ctx.beginPath();
            ctx.arc(bird.x + 9, bird.y - 6, 2, 0, Math.PI * 2);
            ctx.fillStyle = "#000000";
            ctx.fill();
            ctx.closePath();

            // رسم المنقار
            ctx.beginPath();
            ctx.moveTo(bird.x + 18, bird.y - 2);
            ctx.lineTo(bird.x + 28, bird.y + 3);
            ctx.lineTo(bird.x + 18, bird.y + 7);
            ctx.fillStyle = "#FFD700";
            ctx.fill();
            ctx.closePath();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // معالجة اللمس والنقر
        function handleHit(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const clickX = (clientX - rect.left) * scaleX;
            const clickY = (clientY - rect.top) * scaleY;

            const dist = Math.hypot(clickX - bird.x, clickY - bird.y);

            // إضافة نطاق لمس أوسع لسهولة الاصطياد
            if (dist < bird.radius + 25) {
                score++;
                scoreEl.textContent = score;
                resetBird();
            }
        }

        canvas.addEventListener("pointerdown", handleHit);

        loop();
    </script>
</body>
</html>
